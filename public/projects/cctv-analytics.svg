<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none">
  <rect width="1200" height="700" rx="16" fill="#090d16"/>
  <!-- Top Bar -->
  <rect width="1200" height="60" fill="#111827" stroke="#1f293d" stroke-width="1"/>
  <text x="30" y="36" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Surveillance Telemetry &amp; Historical Flow Analytics</text>
  <rect x="940" y="16" width="230" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="955" y="34" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11">EXPORT ENGINE: ReportLab PDF</text>

  <!-- Top Metric Cards Row -->
  <g transform="translate(30, 80)">
    <!-- Card 1 -->
    <rect width="270" height="96" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">TOTAL OBJECTS DETECTED</text>
    <text x="20" y="68" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700">1,482</text>
    <text x="140" y="68" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="11">▲ +12% today</text>

    <!-- Card 2 -->
    <rect x="290" width="270" height="96" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="310" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">IN / OUT TRIPWIRE FLOW</text>
    <text x="310" y="68" fill="#818cf8" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700">842 / 791</text>
    <text x="490" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Net: +51</text>

    <!-- Card 3 -->
    <rect x="580" width="270" height="96" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="600" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">SECURITY AUDIT BREACHES</text>
    <text x="600" y="68" fill="#ef4444" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700">14</text>
    <text x="660" y="68" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="11">All snapshots stored</text>

    <!-- Card 4 -->
    <rect x="870" width="270" height="96" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="890" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">AVG INFERENCE LATENCY</text>
    <text x="890" y="68" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700">12.4ms</text>
    <text x="1030" y="68" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">Zero dropped</text>
  </g>

  <!-- Big Line Chart Area -->
  <g transform="translate(30, 200)">
    <rect width="740" height="470" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="36" fill="#f1f5f9" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Hourly Footfall &amp; Vehicle Passage Telemetry (24h)</text>
    
    <!-- Chart Grid -->
    <line x1="60" y1="390" x2="700" y2="390" stroke="#1e293b" stroke-width="1"/>
    <line x1="60" y1="310" x2="700" y2="310" stroke="#1e293b" stroke-dasharray="4 4"/>
    <line x1="60" y1="230" x2="700" y2="230" stroke="#1e293b" stroke-dasharray="4 4"/>
    <line x1="60" y1="150" x2="700" y2="150" stroke="#1e293b" stroke-dasharray="4 4"/>
    <line x1="60" y1="70" x2="700" y2="70" stroke="#1e293b" stroke-dasharray="4 4"/>

    <text x="25" y="74" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">200</text>
    <text x="25" y="154" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">150</text>
    <text x="25" y="234" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">100</text>
    <text x="25" y="314" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">50</text>
    <text x="35" y="394" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">0</text>

    <!-- Curve Line 1: Persons (Cyan) -->
    <path d="M 70 370 Q 140 350 200 300 T 320 180 T 440 220 T 560 120 T 680 160" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <!-- Curve Line 2: Vehicles (Purple) -->
    <path d="M 70 380 Q 140 370 200 340 T 320 280 T 440 290 T 560 210 T 680 250" fill="none" stroke="#a855f7" stroke-width="2.5"/>

    <!-- Peak Dot -->
    <circle cx="560" cy="120" r="6" fill="#38bdf8"/>
    <rect x="520" y="80" width="80" height="26" rx="4" fill="#0284c7"/>
    <text x="527" y="97" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PEAK: 182</text>

    <!-- X axis labels -->
    <text x="70" y="420" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">00:00</text>
    <text x="190" y="420" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">06:00</text>
    <text x="320" y="420" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">12:00</text>
    <text x="440" y="420" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">15:00</text>
    <text x="560" y="420" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">18:00 (PEAK)</text>
    <text x="660" y="420" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">23:00</text>
  </g>

  <!-- Right: Target Distribution Donut -->
  <g transform="translate(800, 200)">
    <rect width="370" height="470" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="36" fill="#f1f5f9" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Target Class Distribution</text>

    <!-- Donut Ring (SVG circles) -->
    <circle cx="185" cy="170" r="80" stroke="#1e293b" stroke-width="26" fill="none"/>
    <circle cx="185" cy="170" r="80" stroke="#38bdf8" stroke-width="26" stroke-dasharray="320 500" stroke-dashoffset="0" fill="none"/>
    <circle cx="185" cy="170" r="80" stroke="#a855f7" stroke-width="26" stroke-dasharray="110 500" stroke-dashoffset="-320" fill="none"/>
    <circle cx="185" cy="170" r="80" stroke="#10b981" stroke-width="26" stroke-dasharray="50 500" stroke-dashoffset="-430" fill="none"/>

    <text x="165" y="165" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">YOLOv8</text>
    <text x="160" y="185" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">100% Local</text>

    <!-- Legend -->
    <g transform="translate(40, 290)">
      <circle cx="10" cy="10" r="5" fill="#38bdf8"/>
      <text x="25" y="14" fill="#cbd5e1" font-family="sans-serif" font-size="13">Person (68%)</text>
      <text x="240" y="14" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">1,008</text>

      <circle cx="10" cy="45" r="5" fill="#a855f7"/>
      <text x="25" y="49" fill="#cbd5e1" font-family="sans-serif" font-size="13">Cars &amp; Trucks (22%)</text>
      <text x="240" y="49" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">326</text>

      <circle cx="10" cy="80" r="5" fill="#10b981"/>
      <text x="25" y="84" fill="#cbd5e1" font-family="sans-serif" font-size="13">Motorcycles &amp; Cycles (10%)</text>
      <text x="240" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">148</text>
    </g>

    <rect x="25" y="405" width="320" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="431" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">EXPORT TO CSV SPREADSHEET</text>
  </g>
</svg>
