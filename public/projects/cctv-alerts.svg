    <text x="24" y="27" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">TIMESTAMP</text>
    <text x="140" y="27" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SEVERITY</text>
    <text x="240" y="27" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CAMERA</text>
    <text x="360" y="27" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">RULE TRIGGERED</text>
    <text x="560" y="27" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SNAPSHOT EVIDENCE</text>

