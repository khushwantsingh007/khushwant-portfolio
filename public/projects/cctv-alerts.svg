      <text x="24" y="34" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">16:41:50.110</text>
      <rect x="140" y="18" width="65" height="22" rx="4" fill="#0284c7"/>
      <text x="150" y="33" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">NOTICE</text>
      <text x="240" y="34" fill="#f8fafc" font-family="sans-serif" font-size="12">CAM-01 (Gate)</text>
      <text x="360" y="34" fill="#38bdf8" font-family="sans-serif" font-size="12">Tripwire Vector IN (Car #88)</text>
      <rect x="560" y="14" width="80" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="575" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">VIEW JPG</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 156)">
      <line x1="0" y1="56" x2="750" y2="56" stroke="#1e293b"/>
      <text x="24" y="34" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">16:38:04.912</text>
      <rect x="140" y="18" width="65" height="22" rx="4" fill="#d97706"/>
      <text x="148" y="33" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">WARNING</text>
      <text x="240" y="34" fill="#f8fafc" font-family="sans-serif" font-size="12">CAM-04 (Perimeter)</text>
      <text x="360" y="34" fill="#f59e0b" font-family="sans-serif" font-size="12">Crowd Density (18 persons)</text>
      <rect x="560" y="14" width="80" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="575" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">VIEW JPG</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 212)">
      <line x1="0" y1="56" x2="750" y2="56" stroke="#1e293b"/>
      <text x="24" y="34" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">16:35:22.004</text>
      <rect x="140" y="18" width="65" height="22" rx="4" fill="#0284c7"/>
      <text x="150" y="33" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">NOTICE</text>
      <text x="240" y="34" fill="#f8fafc" font-family="sans-serif" font-size="12">CAM-03 (Dock)</text>
      <text x="360" y="34" fill="#38bdf8" font-family="sans-serif" font-size="12">Truck Delivery Identified</text>
      <rect x="560" y="14" width="80" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="575" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">VIEW JPG</text>
    </g>
