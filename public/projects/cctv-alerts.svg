      <text x="360" y="34" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="500">Zone A Polygon Breach</text>
      <rect x="560" y="14" width="80" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="575" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">VIEW JPG</text>
    </g>

    <!-- Row 2 -->
