<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none">
  <rect width="1200" height="700" rx="16" fill="#090d16"/>
  <!-- Top Bar -->
  <rect width="1200" height="60" fill="#111827" stroke="#1f293d" stroke-width="1"/>
  <text x="30" y="36" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Security Incident Center • Sub-second Threat Telemetry</text>
  <rect x="980" y="16" width="190" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="995" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">WS: ws://localhost:8000/ws</text>

  <!-- Left: Threat Severity Breakdown -->
  <g transform="translate(30, 85)">
    <rect width="360" height="585" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="36" fill="#f1f5f9" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Severity Metric Breakdown</text>

    <!-- Stat 1: Critical Intrusion -->
    <rect x="20" y="60" width="320" height="90" rx="8" fill="#1e131d" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4"/>
    <text x="36" y="90" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">CRITICAL INTRUSIONS</text>
    <text x="36" y="130" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">14</text>
    <text x="90" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12">Restricted zone breaches</text>

    <!-- Stat 2: Tripwire Crossing -->
    <rect x="20" y="165" width="320" height="90" rx="8" fill="#0c1f2e" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4"/>
    <text x="36" y="195" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">TRIPWIRE LINE PASSES</text>
    <text x="36" y="235" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">270</text>
    <text x="105" y="235" fill="#94a3b8" font-family="sans-serif" font-size="12">IN: 142 • OUT: 128</text>

    <!-- Stat 3: Crowd Density Alarms -->
    <rect x="20" y="270" width="320" height="90" rx="8" fill="#201a11" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <text x="36" y="300" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">CROWD DENSITY SPIKES</text>
    <text x="36" y="340" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">3</text>
    <text x="80" y="340" fill="#94a3b8" font-family="sans-serif" font-size="12">Exceeded &gt; 15 threshold</text>

    <!-- Audit Export Button -->
    <rect x="20" y="490" width="320" height="48" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="75" y="520" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">DOWNLOAD PDF AUDIT</text>
  </g>

  <!-- Right: Real-time Incident Feed Table -->
  <g transform="translate(420, 85)">
    <rect width="750" height="585" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
