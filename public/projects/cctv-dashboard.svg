    <rect x="24" y="146" width="60" height="18" rx="4" fill="#0284c7"/>
    <text x="32" y="158" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TRIPWIRE</text>
    <text x="95" y="158" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">16:41:50</text>
    <text x="24" y="180" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Line Crossing (Vector IN)</text>
    <text x="24" y="196" fill="#94a3b8" font-family="sans-serif" font-size="11">Main Gate • Vehicle #19</text>

    <!-- Alert Card 3 -->
    <rect x="14" y="220" width="292" height="74" rx="8" fill="#1c2420" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="24" y="230" width="60" height="18" rx="4" fill="#15803d"/>
    <text x="35" y="242" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">AUDIT</text>
    <text x="95" y="242" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">16:40:00</text>
    <text x="24" y="264" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">PDF Report Auto-Generated</text>
    <text x="24" y="280" fill="#94a3b8" font-family="sans-serif" font-size="11">ReportLab • 24hr Incident Summary</text>
